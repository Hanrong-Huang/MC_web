name: Deploy multiplayer server

# Publishes worker/index.ts (the shared online world) to Cloudflare Workers.
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID — shown on the Cloudflare dashboard's Workers page
# Without them the job only type-checks the worker and says what's missing.

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - server/core.ts
      - src/net/protocol.ts
      - wrangler.toml
      - package-lock.json
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the worker
        run: npx tsc --noEmit -p worker

      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy

      - name: Secrets missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Not deployed — add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets (see README → Play online)."
